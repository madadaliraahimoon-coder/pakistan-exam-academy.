 <p class="mut">Correct ${c} · Incorrect ${T.ans.filter((a,i)=>a>=0&&a!==T.qs[i][3]).length} · Skipped ${T.ans.filter(a=>a<0).length}</p></div>
 <h2>Performance analysis</h2><div class="card">${Object.entries(by).map(([k,v])=>`<p class="ui" style="margin:8px 0 2px">${SUBJECTS[k][0]} — ${v[0]}/${v[1]}</p><div class="bar2"><i style="width:${v[0]/v[1]*100}%"></i></div>`).join("")}</div>
 <h2>Review &amp; explanations</h2>${T.qs.map((q,i)=>`<div class="card" style="margin:8px 0"><b>${i+1}. ${esc(q[1])}</b>${q[2].map((o,k)=>`<div class="opt ${k===q[3]?"ok":k===T.ans[i]?"bad":""}">${"ABCD"[k]}. ${esc(o)}${k===q[3]?" ✓":k===T.ans[i]?" ✗ (your answer)":""}</div>`).join("")}<p class="mut">💡 ${esc(q[4])}</p></div>`).join("")}
 <a class="btn" href="#dashboard">Open dashboard</a> <a class="btn alt" href="#mock">New test</a>`;scrollTo(0,0)}
/* ===== PAGES ===== */
const pages={
home(){const h=store.get("hist",[]);return `<div class="hero"><h1>Pakistan Exam Academy</h1><p>Prepare Smart. Practice More. Achieve Success.</p><p>Free preparation for one-paper jobs: FPSC, SPSC, NTS, STS, IBA Sukkur, PPSC, FIA, PST &amp; JEST and more.</p><a class="btn" href="#mock">Start a mock test</a> <a class="btn alt" href="#daily">Daily practice</a></div>
 <h2>Latest government job updates</h2><div class="note">Job ads are never shown unless verified. See <a href="#jobs">Jobs</a> for official portals.</div>
 <h2>Popular examinations</h2><div class="grid">${EXAMS.map(e=>`<a class="card" href="#papers"><h3>${e}</h3><span class="mut">Resources &amp; official links</span></a>`).join("")}</div>
 <h2>Free preparation resources</h2><div class="grid"><a class="card" href="#subjects"><div class="ico">📚</div><h3>10 subjects</h3><span class="mut">Quizzes by subject</span></a><a class="card" href="#material"><div class="ico">📄</div><h3>Study material</h3><span class="mut">Revision sheet download</span></a><a class="card" href="#daily"><div class="ico">⚡</div><h3>Daily MCQ challenge</h3><span class="mut">Fresh set every day</span></a></div>
 <h2>Your dashboard</h2><div class="card">${h.length?`Tests taken: <b>${h.length}</b> · Last score: <b>${h.at(-1).c}/${h.at(-1).n}</b> · <a href="#dashboard">View progress</a>`:`No tests yet. <a href="#mock">Take your first mock test</a>.`}</div>
 <h2>Recent mock tests</h2><div class="card">${h.slice(-3).reverse().map(x=>`${esc(x.t)} — ${x.c}/${x.n} (${x.d})<br>`).join("")||"<span class='mut'>Nothing yet.</span>"}</div>`},
subjects(){return `<h2>Subject-wise preparation</h2><div class="grid">${Object.entries(SUBJECTS).map(([k,v])=>`<a class="card" href="#sub-${k}"><div class="ico">${v[1]}</div><h3>${v[0]}</h3><span class="mut">${v[2]}</span></a>`).join("")}</div>`},
sub(k){const s=SUBJECTS[k];if(!s)return pages.subjects();const pool=Q.filter(q=>q[0]===k);
 return `<h2>${s[1]} ${s[0]}</h2><p class="mut">${s[2]}</p><div class="grid">
 <div class="card"><h3>Topic quiz</h3><p class="mut">${pool.length} practice MCQ(s) available</p><button class="btn sm" ${pool.length?"":"disabled"} data-quiz="${k}">Start quiz</button></div>
 <div class="card"><h3>Important MCQs</h3><p class="mut">Review with explanations after any quiz.</p></div>
 <div class="card"><h3>Notes</h3><p class="mut">Add your notes in the <code>SUBJECTS</code> data.</p></div>
 <div class="card"><h3>Previous questions</h3><p class="mut">Add only verified papers. See <a href="#papers">Past Papers</a>.</p></div>
 <div class="card"><h3>Practice exercises</h3><p class="mut">Use Daily Practice.</p></div></div>
 ${k==="current"?'<div class="note">Current Affairs needs fresh, verified questions. Add them to the question bank regularly.</div>':""}`},
mock(){return `<h2>Online mock test</h2><div class="card"><p>Up to 100 MCQs · 100-minute countdown · auto-marking · explanations · analysis.</p><p class="mut">The sample bank has ${Q.length} original practice questions, so a test uses all of them. Add more to <code>Q</code> and tests grow to 100 automatically.</p><button class="btn" id="go">Start mock test</button></div>`},
papers(){return `<h2>Past papers</h2><div class="note">No papers are reproduced here to avoid inaccurate or unauthorised copies. Download genuine papers from official portals, or add verified ones to your own library.</div><div class="grid">${["FPSC","SPSC","NTS","STS","IBA Sukkur","PST & JEST"].map(e=>`<div class="card"><h3>${e} past papers</h3>${PORTALS[e]?`<a href="${PORTALS[e]}" target="_blank" rel="noopener">Official website ↗</a>`:`<span class="mut">Check the official education department / test-service notices.</span>`}</div>`).join("")}</div>`},
jobs(){return `<h2>Job updates</h2>${JOBS.length?`<div class="wrap card"><table><tr><th>Department</th><th>Post</th><th>Qualification</th><th>Age</th><th>Last date</th><th>How to apply</th><th>Ad</th></tr>${JOBS.map(j=>`<tr><td>${esc(j.dept)}</td><td>${esc(j.post)}</td><td>${esc(j.qual)}</td><td>${esc(j.age)}</td><td>${esc(j.last)}</td><td>${esc(j.how)}</td><td><a href="${esc(j.link)}" target="_blank" rel="noopener">Official ↗</a></td></tr>`).join("")}</table></div>`:`<div class="note">No verified vacancies are loaded. Add real advertisements to the <code>JOBS</code> array (department, post, qualification, age, last date, procedure, official link). Until then, check these portals directly:</div>`}
 <div class="grid">${Object.entries(PORTALS).map(([k,v])=>`<a class="card" href="${v}" target="_blank" rel="noopener"><h3>${k} ↗</h3><span class="mut">Official site</span></a>`).join("")}</div>`},
daily(){const d=day(),qs=Array.from({length:Math.min(20,Q.length)},(_,i)=>Q[(d+i*7)%Q.length]);const s=new Set();const u=qs.filter(q=>!s.has(q)&&s.add(q));
 return `<h2>Daily practice</h2><div class="grid"><div class="card"><h3>Daily MCQs</h3><p class="mut">${u.length} questions today</p><button class="btn sm" id="dq">Start</button></div><div class="card"><h3>Current affairs quiz</h3><p class="mut">Add verified items to the question bank.</p></div></div>
 <h2>Vocabulary of the day</h2><div class="card"><b>${VOCAB[d%VOCAB.length][0]}</b> — ${VOCAB[d%VOCAB.length][1]}</div>
 <h2>Maths question</h2><div class="card">${MATHD[d%MATHD.length][0]}<br><details><summary class="mut">Show answer</summary><b>${MATHD[d%MATHD.length][1]}</b></details></div>
 <h2>Science fact</h2><div class="card">${FACTS[d%FACTS.length]}</div>`},
material(){return `<h2>Study material</h2><div class="grid"><div class="card"><h3>Revision sheet</h3><p class="mut">All practice questions with answers and explanations.</p><button class="btn sm" id="dl">Download (.txt)</button></div><div class="card"><h3>Progress backup</h3><p class="mut">Save your results as a file.</p><button class="btn sm" id="dp">Download (.json)</button></div></div><div class="note">PDF notes, MCQ books and preparation guides: put your own or properly licensed files in a <code>/files</code> folder when hosting and link them here.</div>`},
dashboard(){const h=store.get("hist",[]);if(!h.length)return `<h2>Study dashboard</h2><div class="card">No tests completed yet. <a href="#mock">Start one</a>.</div>`;
 const agg={};h.forEach(x=>Object.entries(x.by).forEach(([k,v])=>{const a=agg[k]=agg[k]||[0,0];a[0]+=v[0];a[1]+=v[1]}));
 const rows=Object.entries(agg).map(([k,v])=>[k,v[0]/v[1]*100]).sort((a,b)=>a[1]-b[1]);
 return `<h2>Study dashboard</h2><div class="grid"><div class="card"><h3>${h.length}</h3><span class="mut">Tests completed</span></div><div class="card"><h3>${Math.round(h.reduce((s,x)=>s+x.c/x.n,0)/h.length*100)}%</h3><span class="mut">Average score</span></div><div class="card"><h3>${SUBJECTS[rows[0][0]][0]}</h3><span class="mut">Weakest subject (${Math.round(rows[0][1])}%)</span></div></div>
 <h2>Subject accuracy</h2><div class="card">${rows.map(r=>`<p class="ui" style="margin:8px 0 2px">${SUBJECTS[r[0]][0]} — ${Math.round(r[1])}%</p><div class="bar2"><i style="width:${r[1]}%"></i></div>`).join("")}</div>
 <h2>Completed tests</h2><div class="wrap card"><table><tr><th>Date</th><th>Test</th><th>Score</th></tr>${h.slice().reverse().map(x=>`<tr><td>${x.d}</td><td>${esc(x.t)}</td><td>${x.c}/${x.n}</td></tr>`).join("")}</table></div><p><button class="btn alt sm" id="rs">Reset progress</button></p>`},
about(){return `<h2>About us</h2><div class="card"><p>Pakistan Exam Academy exists to provide free, accessible competitive-examination preparation for Pakistani students, with honest content: no fake job ads and no invented past papers.</p></div><h2>Contact</h2><div class="card"><p>Add your own contact email or social links here before publishing. Suggestions and corrections are welcome.</p></div>`}};
/* ===== ROUTER ===== */
function route(){stopT();T=null;const r=location.hash.slice(1)||"home";if(r==="run"){location.hash="#mock";return}
 const base=r.startsWith("sub-")?"subjects":r;document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===base));
 app.innerHTML=r.startsWith("sub-")?pages.sub(r.slice(4)):(pages[r]||pages.home)();bind();scrollTo(0,0)}
function bind(){const q=s=>app.querySelector(s);
 app.querySelectorAll("[data-quiz]").forEach(b=>b.onclick=()=>startQuiz(Q.filter(x=>x[0]===b.dataset.quiz),SUBJECTS[b.dataset.quiz][0]+" quiz",0));
 q("#go")&&(q("#go").onclick=()=>startQuiz(Q,"Mock Test",100));
 q("#dq")&&(q("#dq").onclick=()=>{const d=day();startQuiz(Array.from({length:Math.min(20,Q.length)},(_,i)=>Q[(d+i*7)%Q.length]),"Daily MCQs",0)});
 const dl=(n,t,m)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
 q("#dl")&&(q("#dl").onclick=()=>dl("revision-sheet.txt",Q.map((x,i)=>`${i+1}. [${SUBJECTS[x[0]][0]}] ${x[1]}\n   Answer: ${x[2][x[3]]}\n   ${x[4]}\n`).join("\n"),"text/plain"));
 q("#dp")&&(q("#dp").onclick=()=>dl("progress.json",JSON.stringify(store.get("hist",[]),null,1),"application/json"));
 q("#rs")&&(q("#rs").onclick=()=>{if(confirm("Delete all saved progress?")){store.set("hist",[]);route()}})}
addEventListener("hashchange",()=>{if(location.hash!=="#run")route()});route();
</script></body></html>
